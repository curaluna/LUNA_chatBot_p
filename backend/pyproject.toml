[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-chatbot"
version = "1-2"
description = "Chainlit Chat assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text="MIT"}
authors = [{name= "Jonas Besier", email = "jonas.besier.work@gmail.com"}]

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "python-dotenv",
    "certifi",
    
    # LangChain 1.0 Family
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-openai>=1.1.0",
    
    # Database - VECTORS (Generic Adapter)
    "langchain-postgres", 
    "asyncpg", # Driver for Vectors/SQLAlchemy

    # Database - CHECKPOINTS (LangGraph Persistence)
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]", # Driver for Checkpoints
    
    # Google Cloud Connector
    "cloud-sql-python-connector[asyncpg,pycopg3]>=1.10.0",
    "google-cloud-storage",

    # Utilities
    "pypdf",
    "langsmith"
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "isort"]


[tool.ruff]
line-length = 100

[tool.mypy]
strict = true


[tool.setuptools]
include-package-data = true